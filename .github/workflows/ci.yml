name: CI

on:
 push:
    branches:
      - main
 pull_request:
    branches:
      - main

permissions:
  contents: read        

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps: 
      - name: Checkout repo
        uses: actions/checkout@v7 

      - name: Setup node.js
        uses: actions/setup-node@v7 
        with:
           node-version: 24
           cache: npm  

      - name: Install Deps
        run: npm ci

      - name: Verify app
        run: npm run verify